<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐙 KRAKEN PRO - Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #060a18;
            min-height: 100vh;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #0d1528;
            border: 1px solid #1a2a4a;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.04);
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header .icon {
            font-size: 2.5rem;
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00d4ff, #7c3aed, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }
        .header .sub {
            font-size: 0.65rem;
            color: #64748b;
            margin-top: 2px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 8px;
            padding: 8px 14px;
            margin-bottom: 20px;
            font-size: 0.6rem;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 12px #10b981;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .status-text {
            color: #10b981;
            font-weight: 600;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid #1a2a4a;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            font-weight: 600;
        }
        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: monospace;
            margin-top: 4px;
        }
        .value.green { color: #10b981; }
        .value.red { color: #ef4444; }
        .value.blue { color: #00d4ff; }
        .value.gold { color: #f59e0b; }
        .value.purple { color: #8b5cf6; }
        .stat-card.full {
            grid-column: 1 / -1;
        }
        .log-section {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 12px;
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-section .title {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .log-entry {
            font-size: 0.55rem;
            font-family: monospace;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .log-entry .time { color: #64748b; }
        .log-entry .win { color: #10b981; }
        .log-entry .loss { color: #ef4444; }
        .log-entry .signal { color: #00d4ff; }
        .log-entry .info { color: #94a3b8; }
        .log-entry .spike { color: #ff00ff; }
        .footer {
            text-align: center;
            font-size: 0.5rem;
            color: #475569;
            margin-top: 16px;
            border-top: 1px solid #1a2a4a;
            padding-top: 12px;
        }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #060a18; }
        ::-webkit-scrollbar-thumb { background: #1a2a4a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00d4ff; }
        @media (max-width: 480px) {
            .container { padding: 16px; }
            .stat-card .value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="icon">🐙</div>
        <h1>KRAKEN PRO</h1>
        <div class="sub">Spike Forecaster · SOLO BOOM</div>
    </div>

    <div class="status-bar">
        <span><span class="status-dot"></span><span class="status-text">24/7 Activo</span></span>
        <span style="color:#64748b;font-size:0.55rem;">📡 <span id="signal-count">0</span> señales</span>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">🏆 Win Rate</div>
            <div class="value blue" id="winrate">0%</div>
        </div>
        <div class="stat-card">
            <div class="label">📡 Señales</div>
            <div class="value gold" id="signals">0</div>
        </div>
        <div class="stat-card">
            <div class="label">✅ Ganadas</div>
            <div class="value green" id="wins">0</div>
        </div>
        <div class="stat-card">
            <div class="label">❌ Perdidas</div>
            <div class="value red" id="losses">0</div>
        </div>
        <div class="stat-card full">
            <div class="label">📊 Total Operaciones</div>
            <div class="value purple" id="total-trades">0</div>
        </div>
    </div>

    <div class="log-section">
        <div class="title">📋 Últimas operaciones</div>
        <div id="logs-container">
            <div style="color:#475569;font-size:0.55rem;text-align:center;padding:10px;">Esperando operaciones...</div>
        </div>
    </div>

    <div class="footer">🐙 KRAKEN PRO · 24/7 · Railway</div>
</div>

<script>
    function updateStats() {
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                document.getElementById('winrate').textContent = data.winRate + '%';
                document.getElementById('signals').textContent = data.totalSignals || 0;
                document.getElementById('wins').textContent = data.wins || 0;
                document.getElementById('losses').textContent = data.losses || 0;
                document.getElementById('total-trades').textContent = data.totalTrades || 0;
                document.getElementById('signal-count').textContent = data.totalSignals || 0;

                const container = document.getElementById('logs-container');
                container.innerHTML = '';
                if (data.logs && data.logs.length > 0) {
                    data.logs.slice(0, 20).forEach(log => {
                        const div = document.createElement('div');
                        div.className = 'log-entry';
                        const typeClass = log.type === 'win' ? 'win' :
                                         log.type === 'loss' ? 'loss' :
                                         log.type === 'signal' ? 'signal' :
                                         log.type === 'spike' ? 'spike' : 'info';
                        div.innerHTML = `<span class="time">[${log.time}]</span> <span class="${typeClass}">${log.msg}</span>`;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = '<div style="color:#475569;font-size:0.55rem;text-align:center;padding:10px;">Esperando operaciones...</div>';
                }
            })
            .catch(() => {});
    }

    updateStats();
    setInterval(updateStats, 3000);
</script>
</body>
</html>
