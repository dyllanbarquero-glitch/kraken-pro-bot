<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐙 KRAKEN PRO 2.0 - Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .status { display: flex; align-items: center; gap: 10px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #00c853; box-shadow: 0 0 10px #00c853; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .badge { background: rgba(0,200,83,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(0,200,83,0.3); }
        .badge.auto { border-color: #ffc107; background: rgba(255,193,7,0.2); color: #ffc107; }
        .badge.score { border-color: #8b5cf6; background: rgba(139,92,246,0.2); color: #8b5cf6; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px; margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.08); padding: 15px; border-radius: 12px; text-align: center;
        }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; margin-top: 5px; }
        .stat-value.green { color: #00c853; }
        .stat-value.red { color: #ff5252; }
        .stat-value.blue { color: #64b5f6; }
        .stat-value.purple { color: #8b5cf6; }

        .logs-panel {
            background: rgba(0,0,0,0.5); border-radius: 12px; padding: 15px; max-height: 500px; overflow-y: auto;
        }
        .logs-panel h3 { margin-bottom: 10px; color: #667eea; }
        .log-entry { padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; font-family: monospace; }
        .log-win { color: #00c853; }
        .log-loss { color: #ff5252; }
        .log-warning { color: #ffc107; }
        .log-success { color: #00c853; }
        .log-info { color: #64b5f6; }
        .log-signal { color: #00d4ff; font-weight: 700; }
        .log-score { color: #8b5cf6; font-weight: 600; }
        .log-trend { color: #f59e0b; font-weight: 600; }
        .log-start { color: #10b981; font-weight: 700; }

        .footer { margin-top: 20px; text-align: center; opacity: 0.5; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">🐙 KRAKEN PRO 2.0</div>
        <div class="status">
            <span class="dot"></span>
            <span>24/7 Activo</span>
            <span class="badge auto">Auto-inicio</span>
            <span class="badge score">⭐ Score 9+</span>
        </div>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-label">💰 Balance</div>
            <div class="stat-value green" id="balance">$0.00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">📈 Profit Total</div>
            <div class="stat-value" id="profit">$0.00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">🏆 Win Rate</div>
            <div class="stat-value blue" id="winRate">0%</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">📡 Señales</div>
            <div class="stat-value purple" id="signals">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">✅ Wins / ❌ Losses</div>
            <div class="stat-value" id="winsLosses">0 / 0</div>
        </div>
    </div>

    <div class="logs-panel">
        <h3>📋 Historial de Operaciones</h3>
        <div id="logsContainer"></div>
    </div>

    <div class="footer">🐙 KRAKEN PRO 2.0 - Ejecutándose automáticamente 24/7 · Solo visualización</div>
</div>

<script>
    function updateStats() {
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                document.getElementById('balance').textContent = `$${data.balance.toFixed(2)}`;
                const profit = document.getElementById('profit');
                profit.textContent = `${data.totalProfit >= 0 ? '+' : ''}$${data.totalProfit.toFixed(2)}`;
                profit.className = 'stat-value ' + (data.totalProfit >= 0 ? 'green' : 'red');
                const wr = data.totalTrades > 0 ? (data.winCount / data.totalTrades * 100).toFixed(1) : 0;
                document.getElementById('winRate').textContent = `${wr}%`;
                document.getElementById('signals').textContent = data.totalSignals || 0;
                document.getElementById('winsLosses').textContent = `${data.winCount} / ${data.lossCount}`;
                const container = document.getElementById('logsContainer');
                container.innerHTML = '';
                data.logs.forEach(log => {
                    const div = document.createElement('div');
                    div.className = `log-entry log-${log.type}`;
                    div.textContent = `[${log.time}] ${log.msg}`;
                    container.appendChild(div);
                });
            })
            .catch(() => {});
    }

    updateStats();
    setInterval(updateStats, 3000);
</script>
</body>
</html>
